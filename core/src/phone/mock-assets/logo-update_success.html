<!DOCTYPE HTML PUBLIC '-//W3C//DTD HTML 4.01 Transitional//EN''http://www.w3.org/TR/html4/loose.dtd'>
<html lang='de'>
  <head>
    <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
    <meta name='author' content='Unify Software and Solutions GmbH &amp; Co. KG, www.unify.com'>
    <link rel='stylesheet' type='text/css' href='./_page.css'>
    <meta http-equiv='pragma' content='no-cache'>
    <meta http-equiv='expires' content='-1'>
    <title></title>
    </head>
    <body>
      <form name='page' action='./page.cmd' method='post' >
      <input type='hidden' name='page_submit' value='WEBM_Admin_Logo' tabindex='32000'>
      <input type='hidden' name='lang' value='de' tabindex='32001'>
      <table class='Data_Table'>
       <tr>
            <th colspan='2' align='center'>Logo</th>
        </tr>
        <tr>
          <td align='right' width='50%'>
              <font color='black'>
               Use defaults
             </font>
            </td>
           <td>
             <input name='dl-lgo-use-defaults' type='checkbox' value='true' tabindex='2'>
           </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             Download method
         </td>
            <td width=''>
              <select name='dl-lgo-method' size='1' class='select_field' tabindex='3'>
                <option value='0' selected>FTP</option>
                <option value='1'>HTTPS</option>
              </select>
            </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               FTP Server address
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-addr' type='text' size='18' maxlength='92' value='' tabindex='4'>
          </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               FTP Server port
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-port' type='text' size='18' maxlength='5' value='' tabindex='5'>
          </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               FTP account
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-account' type='text' size='18' maxlength='92' value='' tabindex='6'>
          </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               FTP username
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-username' type='text' size='18' maxlength='93' value='' tabindex='7'>
          </td>
        </tr>
        <tr>
          <td align='right'>
           <font color='black'>
             FTP password
           </font>
          </td>
         <td>
           <input name='dl-lgo-password' type='password' size='18' maxlength='24' value='' tabindex='8'>
         </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               FTP path
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-path' type='text' size='18' maxlength='92' value='' tabindex='9'>
          </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               HTTPS base URL
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-base-url' type='text' size='18' maxlength='92' value='' tabindex='10'>
          </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             <font color='black'>
               Filename
             </font>
          </td>
          <td align='center'>
            <input name='dl-lgo-file' type='text' size='18' maxlength='50' value='' tabindex='11'>
          </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             After submit
         </td>
            <td width=''>
              <select name='WEBM-Admin-StartDownload' size='1' class='select_field' tabindex='12'>
                <option value='0'>do nothing</option>
                <option value='1'>start download</option>
              </select>
            </td>
        </tr>
        <tr>
            <td align='center' colspan='2'>
            <font color='green'>
                <i>Transfer completed successfully</i>
             </font>
           </td>
        </tr>
        <tr>
            <td align='center' colspan='1'>
              <input value='Submit' type='submit' tabindex='32700'>
           </td>
            <td align='center' colspan='1'>
              <input value='Reset' type='reset' tabindex='32701'>
           </td>
<input type='hidden' name='WEBMv_Admin_Download_FileType' value='4' tabindex='32013'/>
<input type='hidden' name='WEBMv_Admin_Download_FileName' value='dl-lgo-file' tabindex='32014'/>
        </tr>
      </table>
      </form>
    </body>
</html>
