<!DOCTYPE HTML PUBLIC '-//W3C//DTD HTML 4.01 Transitional//EN''http://www.w3.org/TR/html4/loose.dtd'>
<html lang='en'>
  <head>
    <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
    <meta name='author' content='Unify Software and Solutions GmbH &amp; Co. KG, www.unify.com'>
    <link rel='stylesheet' type='text/css' href='./_page.css'>
    <meta http-equiv='pragma' content='no-cache'>
    <meta http-equiv='expires' content='-1'>
    <title></title>
    </head>
    <body>
      <form name='page' action='./page.cmd' method='post' >
      <input type='hidden' name='page_submit' value='WEBM_User_DisplaySettings' tabindex='32000'>
      <input type='hidden' name='lang' value='en' tabindex='32001'>
      <table class='Data_Table'>
       <tr>
            <th colspan='2' align='center'>Display</th>
        </tr>
        <tr>
            <td align='left' colspan='2' class='sub_heading'>
              Display settings
           </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             Slider brightness
         </td>
            <td width=''>
              <select name='lamp-brightness' size='1' class='select_field' tabindex='2'>
                <option value='0'>-3</option>
                <option value='1'>-2</option>
                <option value='2'>-1</option>
                <option value='3' selected>Default</option>
                <option value='4'>+1</option>
                <option value='5'>+2</option>
                <option value='6'>+3</option>
              </select>
            </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             Sidecar contrast
         </td>
            <td width=''>
              <select name='key-module-display-contrast' size='1' class='select_field' tabindex='3'>
                <option value='0'>-3</option>
                <option value='1'>-2</option>
                <option value='2'>-1</option>
                <option value='3' selected>Default</option>
                <option value='4'>+1</option>
                <option value='5'>+2</option>
                <option value='6'>+3</option>
              </select>
            </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             TouchGuide™
         </td>
            <td width=''>
              <select name='touchguide-sensitivity' size='1' class='select_field' tabindex='4'>
                <option value='0'>0</option>
                <option value='1' selected>1</option>
                <option value='2'>2</option>
                <option value='3'>3</option>
                <option value='4'>4</option>
              </select>
            </td>
        </tr>
        <tr>
            <td align='left' colspan='2' class='sub_heading'>
              Miscellaneous
           </td>
        </tr>
        <tr>
            <td align='right' width='50%'>
             Skin
         </td>
            <td width=''>
              <select name='display-skin' size='1' class='select_field' tabindex='5'>
                <option value='0'>Silver Blue</option>
                <option value='1' selected>Anthracite Orange</option>
              </select>
            </td>
        </tr>
        <tr>
            <td align='center' colspan='1'>
              <input value='Submit' type='submit' tabindex='32700'>
           </td>
            <td align='center' colspan='1'>
              <input value='Reset' type='reset' tabindex='32701'>
           </td>
        </tr>
      </table>
      </form>
    </body>
</html>
